name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Require signed and notarized macOS release builds
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:release
      - run: npm run release:check
      - run: npm run build

  build:
    name: Package (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}-${{ inputs.release && 'release' || 'check' }}
          cache-on-failure: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 file rpm xdg-utils

      - run: npm ci

      - name: Require macOS release credentials
        if: runner.os == 'macOS' && inputs.release
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release credential: $name"
              exit 1
            fi
          done

      - name: Prepare frontend assets for native tests
        # generate_context! embeds frontendDist even in cargo test builds.
        run: npm run build

      - name: Test Rust code
        # Intel macOS is cross-compiled on ARM; tests run in the ARM job.
        if: matrix.platform != 'macos-x86_64'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build platform packages
        uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPLE_CERTIFICATE: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: >-
            ${{ inputs.release && (vars.APPLE_SIGNING_IDENTITY || 'Developer ID Application: Abdenasser Elidrissi (785JV74B9Y)') || '-' }}
          APPLE_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          # Build only: release assets upload after every platform passes.
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Check AppImage display libraries
        if: runner.os == 'Linux'
        run: node scripts/release.mjs check-appimage src-tauri/target/${{ matrix.target }}/release/bundle/appimage

      - name: Verify macOS release signature and notarization
        if: runner.os == 'macOS' && inputs.release
        shell: bash
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_ROOT/macos/NeoHtop.app"
          xcrun stapler validate "$BUNDLE_ROOT/macos/NeoHtop.app"

      - name: Stage and validate platform packages
        run: node scripts/release.mjs stage ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
