[package]
name = "neohtop"
version = "1.3.0"
description = "A cross-platform system monitor"
authors = ["you"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
tauri = { version = "2.1.1", features = ["macos-private-api", "tray-icon"] }
sysinfo = { version = "0.35.2", features = ["disk", "multithread", "network", "system"] }
listeners = "0.6"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
window-vibrancy = "0.5.2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"            # Strip expensive panic clean-up logic
codegen-units = 1          # Compile crates one after another so the compiler can optimize better
lto = "fat"                # More aggressive link-time optimization
opt-level = 3              # Optimize for maximum performance
strip = true               # Remove debug symbols
incremental = false         # Disable incremental compilation

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
file_icon_provider = "=1.0.2"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
